[package]
name = "poole-userspace"
version = "0.0.0"
edition = "2024"
license-file = "../../LICENSE"
publish = false

[workspace]

[[bin]]
name = "PooleShell"
path = "src/bin/shell.rs"
test = false
bench = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "PooleAppShell"
path = "src/bin/application_shell.rs"
test = false
bench = false

[[bin]]
name = "PooleAppFiles"
path = "src/bin/application_files.rs"
test = false
bench = false

[[bin]]
name = "PooleText"
path = "src/bin/text.rs"
test = false
bench = false

[[bin]]
name = "PooleNumbers"
path = "src/bin/numbers.rs"
test = false
bench = false

[[bin]]
name = "PooleFiles"
path = "src/bin/files.rs"
test = false
bench = false

[[bin]]
name = "PooleFileInit"
path = "src/bin/file_init.rs"
test = false
bench = false

[[bin]]
name = "PooleFileShell"
path = "src/bin/file_shell.rs"
test = false
bench = false

[[bin]]
name = "PooleControlShell"
path = "src/bin/control_shell.rs"
test = false
bench = false

[[bin]]
name = "PooleWorker"
path = "src/bin/worker.rs"
test = false
bench = false

[[bin]]
name = "PooleSupervisor"
path = "src/bin/supervisor.rs"
test = false
bench = false

[[bin]]
name = "PooleInit"
path = "src/bin/init.rs"
test = false
bench = false

[[bin]]
name = "PooleMultiSupervisor"
path = "src/bin/multi_supervisor.rs"
test = false
bench = false

[[bin]]
name = "PooleCounter"
path = "src/bin/counter.rs"
test = false
bench = false

[profile.release]
opt-level = "s"
codegen-units = 1
lto = false
debug = 0
incremental = false
overflow-checks = true
panic = "abort"
strip = "symbols"

[[bin]]
name = "PooleConsole"
path = "src/bin/console.rs"
test = false
bench = false

[[bin]]
name = "PooleConsoleService"
path = "src/bin/console_service.rs"
test = false
bench = false

[[bin]]
name = "PooleConsoleClient"
path = "src/bin/console_client.rs"
test = false
bench = false
