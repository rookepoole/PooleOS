[package]
name = "poolekernel"
version.workspace = true
edition.workspace = true
license-file.workspace = true
publish.workspace = true

[features]
default = []
host-probe = []
development-process-control = []
development-process-launch = ["development-session"]
development-process-launch-bad-owner = ["development-process-launch"]
development-session = []
development-session-bad-startup = ["development-session"]
development-console = ["development-session"]
development-console-bad-handle = ["development-console"]
development-console-ipc = ["development-console"]
development-shell-process = ["development-console-ipc"]
development-files = ["development-shell-process"]
development-files-bad-handle = ["development-files"]
development-applications = ["development-files"]
development-applications-bad-file = ["development-applications"]
development-file-controls = ["development-applications"]
development-claimed-requester = ["development-applications"]
development-app-cleanup-exhaustion = ["development-applications", "development-shell-deferred-cleanup"]
development-shell-process-bad-owner = ["development-shell-process"]

development-shell-cleanup-retry = ["development-shell-process"]
development-shell-deferred-cleanup = ["development-shell-cleanup-retry"]
development-shell-prepared-stop = ["development-shell-cleanup-retry"]
development-console-ipc-bad-peer = ["development-console-ipc"]
development-session-capacity = ["development-console-ipc"]
development-session-capacity-bad-startup = ["development-session-capacity"]

[[bin]]
name = "PooleKernelLinked"
path = "src/main.rs"

[[bin]]
name = "pkreval1-probe"
path = "src/bin/pkreval1_probe.rs"
required-features = ["host-probe"]

[[bin]]
name = "pksched1-probe"
path = "src/bin/pksched1_probe.rs"
required-features = ["host-probe"]

[[bin]]
name = "pksched2-probe"
path = "src/bin/pksched2_probe.rs"
required-features = ["host-probe"]

[[bin]]
name = "pksched3-probe"
path = "src/bin/pksched3_probe.rs"
required-features = ["host-probe"]

[[bin]]
name = "pksched4-probe"
path = "src/bin/pksched4_probe.rs"
required-features = ["host-probe"]

[[bin]]
name = "pksched5-probe"
path = "src/bin/pksched5_probe.rs"
required-features = ["host-probe"]

[[bin]]
name = "pksched6-probe"
path = "src/bin/pksched6_probe.rs"
required-features = ["host-probe"]

[[bin]]
name = "pkatom1-probe"
path = "src/bin/pkatom1_probe.rs"
required-features = ["host-probe"]

[[bin]]
name = "pklock1-probe"
path = "src/bin/pklock1_probe.rs"
required-features = ["host-probe"]

[dependencies]
poole-boot-trust = { path = "../trust" }
poole-bootload = { path = "../bootload" }
poole-handoff = { path = "../handoff" }
poole-inner-live = { path = "../inner" }
poole-kmap = { path = "../kmap" }
